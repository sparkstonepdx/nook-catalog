# Builds the catalog from apps/*.json with nook's catalog-build, signs it with CATALOG_SIGNING_KEY and
# publishes index.json, index.json.sig and catalog.pub to the dist branch, where servers fetch them.
# Then builds the storefront (site/) from that index and deploys it to a nook server.
# Daily, so new upstream releases reach servers; each app's update policy decides what happens then.
# Pull requests build both and deploy a preview of the storefront, but publish nothing.
#
# Storefront setup (optional): the NOOK_TOKEN secret, a deploy token from nook 1.6 or later (it carries
# the server's address; for an older token, also set the NOOK_URL variable). NOOK_SITE picks the site name (default: catalog, so catalog.<default domain>).
name: catalog
on:
  push:
    branches: [main]
    paths: ["apps/**", "images/**", "site/**", "catalog.pub", ".github/workflows/catalog.yml"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false
env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  STOREFRONT: ${{ secrets.NOOK_TOKEN != '' }}
jobs:
  catalog:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
      - uses: actions/setup-go@v5
        if: github.event.action != 'closed'
        with:
          go-version: stable
      # Without a key the catalog isn't published, but the storefront still builds and deploys.
      - name: Check the key is set up
        id: key
        if: env.PUBLISH == 'true'
        env:
          KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          if [ -s catalog.pub ] && [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::no catalog.pub or CATALOG_SIGNING_KEY: run scripts/setup-catalog-key.sh. Not publishing the catalog."; fi
      - name: Build (finds each app's release, pins its sha256)
        if: github.event.action != 'closed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run github.com/sparkstonepdx/nook/cmd/catalog-build@latest apps > index.json
      - name: Sign
        if: steps.key.outputs.ok == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: go run github.com/sparkstonepdx/nook/cmd/release-sign@latest sign index.json > index.json.sig
      - name: Publish to dist (only when the apps or the key changed)
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dist"
          old=$(curl -fsSL "$base/index.json" 2>/dev/null | jq -S '.apps' || echo none)
          oldkey=$(curl -fsSL "$base/catalog.pub" 2>/dev/null || echo none)
          if [ "$old" = "$(jq -S '.apps' index.json)" ] && [ "$oldkey" = "$(cat catalog.pub)" ]; then echo "catalog unchanged"; exit 0; fi
          mkdir dist && cp index.json index.json.sig catalog.pub dist/ && if [ -d images ]; then cp -r images dist/; fi
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Catalog $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dist
          jq -r '.apps[] | "\(.id) \(.version)"' index.json
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the storefront
        if: github.event.action != 'closed'
        working-directory: site
        env:
          INDEX: ../index.json
          VITE_CATALOG_REPO: ${{ github.repository }}
        run: npm ci --no-audit --no-fund && npm run build
      - name: Deploy the storefront
        if: env.STOREFRONT == 'true'
        uses: sparkstonepdx/nook/deploy@v1
        with:
          url: ${{ vars.NOOK_URL }}
          token: ${{ secrets.NOOK_TOKEN }}
          site: ${{ vars.NOOK_SITE || 'catalog' }}
          dir: site/dist/client
